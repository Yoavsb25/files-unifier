<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Unifier logo">
  <title>Unifier</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" rx="264" fill="url(#tile)"/>
  <!-- Left stem, upper segment: translucent as in the original artwork -->
  <path d="M370 375V548" stroke="#fff" stroke-opacity=".55" stroke-width="150" stroke-linecap="round" fill="none"/>
  <!-- U body: left stem lower segment, bowl, right stem -->
  <path d="M370 548V660A230 230 0 0 0 830 660V375" stroke="#fff" stroke-width="150" stroke-linecap="round" fill="none"/>
</svg>
